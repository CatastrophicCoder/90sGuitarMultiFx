name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version .clang-format was written against; newer releases reflow differently.
      - name: Install clang-format
        run: pipx install clang-format==18.1.8

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files 'src/*.h' 'src/*.cpp' 'tests/*.h' 'tests/*.cpp')

  build:
    name: ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # JUCE's Linux dependencies. The web browser and CURL are disabled in CMakeLists.txt, so
      # WebKitGTK and libcurl are not needed.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Puts MSVC on the PATH so Ninja can drive it, keeping one single-config build everywhere.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build

      # The editor test creates components, which on Linux needs an X display.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure --output-junit test-results.xml

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml

      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.config }}
          path: build/test-results.xml
          if-no-files-found: warn

      # Unsigned development builds; no signing or notarisation secrets at this stage (plan §20).
      - name: Package standalone and plugins
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: NinetiesMultiFx-${{ matrix.os }}
          path: build/A5Plugin_artefacts/Release
          if-no-files-found: error
